<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure Neumorphic Weather Clock</title>
    <style>
        :root {
            --size: 60px;
            --padding: 10px;
            --font-size: 24px;
            --gap: 20px;
            
            /* Tema Warna Azure */
            --bg-color: #007FFF;
            --text-active: #ffffff; 
            --text-inactive: rgba(255, 255, 255, 0.5); 
            --date-color: #fde047; 
            
            /* Bayangan Neumorphic menyesuaikan biru Azure */
            --shadow-light: #3399ff;
            --shadow-dark: #0066cc;
        }

        /* Responsif untuk Layar Tablet */
        @media (max-width: 768px) {
            :root {
                --size: 45px;
                --padding: 8px;
                --font-size: 20px;
                --gap: 15px;
            }
        }

        /* Responsif untuk Layar HP */
        @media (max-width: 480px) {
            :root {
                --size: 32px;
                --padding: 5px;
                --font-size: 16px;
                --gap: 10px;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* Font bawaan Apple (San Francisco) */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* --- Latar Belakang Gambar --- */
        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            filter: blur(12px); /* Blur sekitar 20-40% */
            transform: scale(1.1); /* Mencegah tepi putih karena efek blur */
            z-index: -2;
            transition: background-image 1s ease-in-out;
        }

        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.15); /* Sedikit gelap agar teks putih tetap terbaca */
            z-index: -1;
        }

        /* --- Tampilan Info Tanggal & Cuaca --- */
        .info-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 40px;
            z-index: 10;
        }

        .date-display {
            color: var(--date-color);
            font-size: calc(var(--font-size) * 1.2);
            font-weight: 700;
            text-shadow: 2px 2px 4px var(--shadow-dark);
            text-align: center;
        }

        .weather-display {
            color: var(--text-active);
            font-size: calc(var(--font-size) * 1);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 2px 2px 4px var(--shadow-dark);
        }

        /* --- Area Jam --- */
        .clock-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .clock {
            display: flex;
            align-items: center;
            gap: var(--gap);
        }

        .time-group {
            display: flex;
            gap: calc(var(--gap) / 1.5);
        }

        .time-group:not(:last-child)::after {
            content: ':';
            font-size: calc(var(--font-size) * 1.5);
            font-weight: bold;
            color: var(--text-active);
            display: flex;
            align-items: center;
        }

        /* Jendela Penampil 3 Angka */
        .strip-container {
            position: relative;
            width: calc(var(--size) + 10px);
            height: calc(var(--size) * 3); /* Menampilkan 3 baris angka */
            display: flex;
            justify-content: center;
            /* Efek Fade / Transparan menyatu ke background di atas dan bawah */
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 25%, black 75%, transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0%, black 25%, black 75%, transparent 100%);
        }

        .strip {
            position: absolute;
            top: 0;
            width: var(--size);
            display: flex;
            flex-direction: column;
            /* Pergeseran agar angka aktif selalu di tengah jendela 3 baris */
            transform: translateY(calc( (var(--digit, 0) * var(--size) * -1) + var(--size) ));
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Gaya Angka Standar (Pudar) */
        .number {
            height: var(--size);
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: var(--font-size);
            font-weight: 700;
            color: var(--text-inactive);
            transition: all 0.4s ease;
            border-radius: 50%;
        }

        /* Gaya Angka Aktif (Tengah) */
        .number.pop {
            color: var(--text-active); /* Putih Bersih */
            transform: scale(1.15); /* Membesar bulat sempurna */
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
            /* Ubah solid blue menjadi efek kaca (Glassmorphism) */
            background-color: rgba(255, 255, 255, 0.15); 
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
    </style>
</head>
<body>

    <!-- Latar Belakang Gambar Dinamis -->
    <div class="bg-image" id="bgImage"></div>
    <div class="bg-overlay"></div>

    <!-- Container Header: Tanggal & Cuaca -->
    <div class="info-container">
        <div class="date-display" id="dateDisplay">Memuat Tanggal...</div>
        <div class="weather-display" id="weatherDisplay">Memuat Cuaca...</div>
    </div>

    <!-- Container Jam -->
    <div class="clock-wrapper">
        <div class="clock">
            <div class="time-group">
                <div class="strip-container"><div class="strip" id="hr1"></div></div>
                <div class="strip-container"><div class="strip" id="hr2"></div></div>
            </div>
            <div class="time-group">
                <div class="strip-container"><div class="strip" id="min1"></div></div>
                <div class="strip-container"><div class="strip" id="min2"></div></div>
            </div>
            <div class="time-group">
                <div class="strip-container"><div class="strip" id="sec1"></div></div>
                <div class="strip-container"><div class="strip" id="sec2"></div></div>
            </div>
        </div>
    </div>

    <script>
        const maxDigits = [2, 9, 5, 9, 5, 9]; 
        const strips = document.querySelectorAll('.strip');
        const dateDisplay = document.getElementById('dateDisplay');

        // Buat deretan angka ke dalam HTML secara otomatis
        strips.forEach((strip, index) => {
            for (let i = 0; i <= maxDigits[index]; i++) {
                const numDiv = document.createElement('div');
                numDiv.classList.add('number');
                numDiv.innerText = i;
                strip.appendChild(numDiv);
            }
        });

        function updateTime() {
            const now = new Date();
            
            // Format & Update Tanggal
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            dateDisplay.innerText = now.toLocaleDateString('id-ID', options);

            // Format & Update Jam
            const timeString = 
                String(now.getHours()).padStart(2, '0') +
                String(now.getMinutes()).padStart(2, '0') +
                String(now.getSeconds()).padStart(2, '0');

            strips.forEach((strip, index) => {
                const digit = parseInt(timeString[index]);
                
                // Memicu animasi CSS geser per kolom
                strip.style.setProperty('--digit', digit);

                // Mengatur efek timbul (Neumorphic) hanya untuk angka saat ini
                const numbers = strip.querySelectorAll('.number');
                numbers.forEach(num => num.classList.remove('pop'));
                
                if(numbers[digit]) {
                    numbers[digit].classList.add('pop');
                }
            });
        }

        // Jalankan jam setiap detik
        setInterval(updateTime, 1000);
        updateTime();

        // Titik Kordinat Jogja
        const lat = -7.7956;
        const lon = 110.3695;

        async function fetchWeather() {
            try {
                // Mengambil data cuaca gratis dari Open-Meteo tanpa API Key
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                const data = await response.json();
                
                if (data && data.current_weather) {
                    const temp = Math.round(data.current_weather.temperature);
                    const weatherCode = data.current_weather.weathercode;
                    const isDay = data.current_weather.is_day;
                    
                    let icon = '☁️';
                    let bgImg = '4.png'; // 4. Mendung (Default)

                    // Konversi WMO Code menjadi Ikon Emoji dan Gambar Latar
                    if (weatherCode === 0 || weatherCode === 1) {
                        icon = isDay ? '☀️' : '🌙'; 
                        bgImg = isDay ? '1.png' : '2.png'; // 1. Matahari siang, 2. Bulan malam
                    } else if (weatherCode >= 2 && weatherCode <= 3) {
                        icon = '☁️'; 
                        bgImg = isDay ? '4.png' : '2.png'; // 4. Mendung siang, 2. Bulan malam
                    } else if (weatherCode >= 51 && weatherCode <= 67) {
                        icon = '🌧️'; 
                        bgImg = '3.png'; // 3. Hujan
                    } else if (weatherCode >= 95) {
                        icon = '⛈️'; 
                        bgImg = '3.png'; // 3. Hujan Badai
                    }

                    // Hanya tampilkan Ikon dan Suhu (tanpa teks tambahan)
                    document.getElementById('weatherDisplay').innerHTML = `${icon} ${temp}°C`;
                    // Terapkan latar belakang gambar
                    document.getElementById('bgImage').style.backgroundImage = `url('${bgImg}')`;
                }
            } catch (error) {
                console.error("Gagal mengambil data cuaca:", error);
                document.getElementById('weatherDisplay').innerText = "☀️ --°C";
                document.getElementById('bgImage').style.backgroundImage = "url('1.png')";
            }
        }

        // Panggil fungsi cuaca saat web dimuat
        fetchWeather();
        // Update cuaca secara otomatis setiap 15 menit
        setInterval(fetchWeather, 15 * 60 * 1000);
    </script>
</body>
</html>
